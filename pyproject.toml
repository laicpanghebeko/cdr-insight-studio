[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cdr-insight-studio"
version = "1.0.0"
description = "Privacy-conscious Streamlit workspace for telecom listing and IMEI analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "laicpanghebeko-lab"},
]
keywords = ["cdr", "telecom", "streamlit", "pdf", "imei", "data-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Streamlit",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "PyMuPDF>=1.26,<2",
  "python-docx>=1.2,<2",
  "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/laicpanghebeko-lab/cdr-insight-studio"
Repository = "https://github.com/laicpanghebeko-lab/cdr-insight-studio"
Issues = "https://github.com/laicpanghebeko-lab/cdr-insight-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/cdr_insight/engine.py" = ["E501"]
